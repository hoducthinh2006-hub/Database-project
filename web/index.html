<div class="shell">
  <!-- ===== Sidebar trái ===== -->
  <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
    <div class="sb-head">
      <div class="brand" role="button" tabindex="0" data-go="home">
        <svg class="mark" viewBox="0 0 40 40" role="img" aria-label="Logo N9"><rect class="mk-bg" width="40" height="40" rx="12"/><text class="mk-txt" x="21" y="27.5" text-anchor="middle"><tspan class="mk-n">N</tspan><tspan class="mk-9">9</tspan></text></svg>N9
      </div>
      <button class="icon-btn sb-close" id="sbClose" aria-label="Đóng menu"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-recent" id="sbRecent"></div>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>
  <div class="side-scrim" id="sideScrim"></div>

  <!-- ===== Khu vực chính ===== -->
  <div class="stage">
    <header class="topbar">
      <button class="icon-btn hamburger" id="hamBtn" aria-label="Mở menu"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="gsearch" id="gSearch" role="search">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="gSearchInput" type="search" placeholder="Tìm khóa học, giảng viên…" autocomplete="off" aria-label="Tìm khóa học" aria-expanded="false" aria-controls="gsPop">
        <kbd>Ctrl K</kbd>
        <div class="pop gs-pop" id="gsPop" role="listbox" hidden></div>
      </div>
      <div class="top-right">
        <span id="topAction"></span>
        <button class="icon-btn" id="paletteBtn" aria-label="Đổi tông màu" title="Tông màu"><svg class="ico"><use href="#i-palette"/></svg></button>
        <button class="icon-btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối" title="Sáng / Tối"><svg class="ico"><use href="#i-moon"/></svg></button>
        <div class="bell-wrap" id="bellWrap"></div>
        <span id="navAuth" class="nav-auth"></span>
      </div>
      <div class="pop pal-pop" id="palPop" hidden>
        <div class="pal-title">Chọn tông màu chủ đạo</div>
        <div class="pal-grid" id="palGrid"></div>
        <label class="pal-toggle"><input type="checkbox" id="galaxyToggle" checked><span>Nền thiên hà <small>(chế độ tối)</small></span></label>
        <label class="pal-toggle"><input type="checkbox" id="fxToggle" checked><span>Hiệu ứng nâng cao <small>(tắt nếu máy bị giật)</small></span></label>
        <label class="pal-toggle" id="galaxyMotionRow" hidden><input type="checkbox" id="galaxyMotion"><span>Cho phép nền chuyển động <small>(máy bạn đang bật "giảm chuyển động" nên nền đứng yên)</small></span></label>
        <div class="pal-note">Áp dụng ngay · tự lưu cho lần sau</div>
      </div>
    </header>

    <main id="app"></main>

    <footer>
      <span>Đồ án môn Cơ sở dữ liệu · Nền tảng học trực tuyến · Dữ liệu minh họa</span>
      <span>© 2026 Nhóm BTL_CSDL</span>
    </footer>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
